<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Speech Enhancer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>AI Speech Enhancer</h1>
    <p>Upload audio → Enhance → Download</p>
  </header>

  <main>
    <div class="card">

      <input type="file" id="audioInput" accept="audio/*" />
      <button id="enhanceBtn">Enhance Audio</button>

      <div id="status" class="status"></div>

      <div class="players">
        <div>
          <h3>Original</h3>
          <audio id="originalAudio" controls></audio>
        </div>

        <div>
          <h3>Enhanced</h3>
          <audio id="enhancedAudio" controls></audio>
          <a id="downloadLink" download="enhanced.wav">Download Enhanced Audio</a>
        </div>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
